name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IS_RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Releases must always be signed with the same private key, kept in the repository's Actions secrets.
      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Phones often add spaces or line breaks when pasting long text; drop them before decoding.
            clean=$(printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t')
            ks="$RUNNER_TEMP/release.keystore"
            printf '%s' "$clean" | base64 -d > "$ks" 2>/dev/null || true
            echo "SIGNING_KEYSTORE_BASE64 has ${#clean} characters, decoded to $(stat -c %s "$ks") bytes."
            if ! keytool -list -keystore "$ks" -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
              echo "::error::The signing key could not be opened. SIGNING_KEYSTORE_BASE64 has ${#clean} characters: check that the whole text was pasted (the N-assistant key is 3544 characters and ends with ==), and that SIGNING_STORE_PASSWORD matches it."
              exit 1
            fi
            echo "SIGNING_KEYSTORE_PATH=$ks" >> "$GITHUB_ENV"
          elif [ "$IS_RELEASE" = "true" ]; then
            echo "::error::Add the SIGNING_KEYSTORE_BASE64 and SIGNING_STORE_PASSWORD secrets (Settings > Secrets and variables > Actions) before releasing."
            exit 1
          else
            echo "No signing secret: building a test APK signed with the debug key."
          fi

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK by version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/gps-tracker-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: gps-tracker-1.0.${{ github.run_number }}
          path: dist/*.apk

      # Every push to main becomes a GitHub Release with the APK attached.
      - name: Publish release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" dist/*.apk \
            --title "GPS-Tracker 1.0.${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%s)"
